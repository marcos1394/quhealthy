name: Enterprise Frontend CI/CD

permissions:
  contents: read

on:
  push:
    branches: [ master ] # Producción
  pull_request:
    branches: [ master ] # Preview

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Job 1: Verificación de Calidad (Puerta obligatoria de bloqueo)
  quality-assurance:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint Check
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Build Check
        run: npm run build

  # Job 2: Construcción y Despliegue (Bloqueado estrictamente si falla quality-assurance)
  deploy:
    name: Build & Deploy
    needs: quality-assurance # Solo despliega si pasa el control de calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI (pinned)
        run: npm install --global vercel@59.15.1

      - name: Pull Vercel Environment Information
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build Project Artifacts
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Build para Preview (sin flag --prod)
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          else
            # Build para Producción (con flag --prod)
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Despliegue a URL temporal (Preview)
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          else
            # Despliegue a Dominio Principal (Production)
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          fi