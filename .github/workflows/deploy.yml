name: Enterprise Frontend CI/CD

permissions:
  contents: read

on:
  push:
    branches: [ master, staging ] # Producción y Staging
  pull_request:
    branches: [ master, staging ] # Preview

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Job 1: Verificación de Calidad (Puerta obligatoria de bloqueo)
  quality-assurance:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint Check
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Build Check
        run: npm run build

  # Job 2: Construcción y Despliegue (Bloqueado estrictamente si falla quality-assurance)
  deploy:
    name: Build & Deploy
    needs: quality-assurance # Solo despliega si pasa el control de calidad
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI (pinned)
        run: npm install --global vercel@59.15.1

      - name: Pull Vercel Environment Information
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build Project Artifacts
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            # Build para Producción (con flag --prod)
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            # Build para Staging / Preview (sin flag --prod)
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel
        id: vercel_deploy
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            # Despliegue a Dominio Principal (Production)
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            # Despliegue a Staging y actualización de alias staging.quhealthy.org
            PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
            echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            vercel alias set "$PREVIEW_URL" staging.quhealthy.org --token=${{ secrets.VERCEL_TOKEN }} || true
          fi
